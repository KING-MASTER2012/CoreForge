[workspace]
resolver = "3"

members = [
    "crates/*",
]

[workspace.package]
edition = "2024"
license = "GPL-3.0-only"
repository = "https://github.com/KING-MASTER2012/CoreForge"
rust-version = "1.97.1"

[workspace.dependencies]
clap = { version = "4.6.5", features = ["derive"] }
anyhow = "1.0.104"
thiserror = "2.0.19"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.4+spec-1.1.0"
petgraph = "0.8.3"

coreforge-core = { path = "crates/coreforge-core" }
coreforge-graph = { path = "crates/graph" }
coreforge-scheduler = { path = "crates/scheduler" }
coreforge-resolver = { path = "crates/resolver" }
coreforge-executor = { path = "crates/executor" }
coreforge-manifest = { path = "crates/manifest" }
coreforge-cache = { path = "crates/cache" }
coreforge-platform = { path = "crates/platform" }
coreforge-toolchain = { path = "crates/toolchain" }
coreforge-diagnostics = { path = "crates/diagnostics" }
coreforge-logging = { path = "crates/logging" }
coreforge-config = { path = "crates/config" }
coreforge-utils = { path = "crates/utils" }

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
incremental = true
