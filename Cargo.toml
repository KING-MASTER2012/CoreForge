[workspace]
resolver = "3"

members = [
    "crates/*",
]

[workspace.package]
edition = "2024"
license = "GPL-3.0-only"
repository = "https://github.com/KING-MASTER2012/CoreForge"
rust-version = "1.97.1"
authors = ["KING-MASTER2012"]
homepage = "https://github.com/KING-MASTER2012/CoreForge"
categories = ["development-tools"]
keywords = ["build-system", "compiler", "rust"]

[workspace.dependencies]
clap = { version = "4.6.5", features = ["derive"] }
anyhow = "1.0.104"
thiserror = "2.0.19"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.4+spec-1.1.0"
petgraph = "0.8.3"
tokio = { version = "1.53.1", features = ["full"]}
camino = { version = "1.2.5", features = ["serde1"]}
walkdir = "2.5.0"
blake3 = "1.8.5"
uuid = { version = "1.24.0", features = ["v4", "serde"] }
globset = "0.4.19"
regex = "1.13.1"
rayon = "1.12.0"
indicatif = "0.18.6"
owo-colors = "4.3.0"
chrono = { version = "0.4.45", features = ["serde"] }
notify = "9.0.0-rc.4"
clap_complete = "4.6.8"
clap_mangen = "0.3.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

coreforge-core = { path = "crates/coreforge-core" }
graph = { path = "crates/graph" }
scheduler = { path = "crates/scheduler" }
resolver = { path = "crates/resolver" }
executor = { path = "crates/executor" }
manifest = { path = "crates/manifest" }
cache = { path = "crates/cache" }
platform = { path = "crates/platform" }
toolchain = { path = "crates/toolchain" }
diagnostics = { path = "crates/diagnostics" }
logging = { path = "crates/logging" }
config = { path = "crates/config" }
utils = { path = "crates/utils" }
inspector = { path = "crates/inspector" }

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
opt-level = 3

[profile.dev]
incremental = true
debug = true

[workspace.lints.rust]
unsafe_code = "warn"
missing_docs = "allow"

[workspace.lints.clippy]
all = "warn"
pedantic = "allow"
nursery = "allow"
cargo = "allow"
