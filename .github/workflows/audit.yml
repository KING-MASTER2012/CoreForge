name: Cargo Audit

on:
    schedule:
        - cron: "0 3 * * 1"

    workflow_dispatch:

    pull_request:

permissions:
    contents: read

jobs:
    audit:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v5

            - uses: dtolnay/rust-toolchain@master
              with:
                  toolchain: "1.97.1"

            - uses: Swatinem/rust-cache@v2

            - name: Install cargo-audit
              run: cargo install cargo-audit --locked

            - name: Run cargo audit
              run: cargo audit
