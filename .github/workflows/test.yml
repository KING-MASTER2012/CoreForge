name: Tests

on:
    pull_request:
    push:
        branches:
            - main
            - develop

permissions:
    contents: read

jobs:
    test:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v5

            - uses: dtolnay/rust-toolchain@master
              with:
                  toolchain: "1.97.1"

            - uses: Swatinem/rust-cache@v2

            - name: Run tests
              run: cargo test --workspace --all-features
