name: Release Build

on:
    workflow_dispatch:

    push:
        tags:
            - "v*"

permissions:
    contents: read

env:
    CARGO_TERM_COLOR: always

jobs:
    release:
        strategy:
            fail-fast: false

            matrix:
                os:
                    - ubuntu-latest
                    - windows-latest
                    - macos-latest

        runs-on: ${{ matrix.os }}

        steps:
            - uses: actions/checkout@v5

            - uses: dtolnay/rust-toolchain@master
              with:
                  toolchain: "1.97.1"

            - uses: Swatinem/rust-cache@v2

            - name: Build Release
              run: cargo build --workspace --release --all-features

            - name: Upload Artifact
              uses: actions/upload-artifact@v4
              with:
                  name: coreforge-${{ matrix.os }}
                  path: target/release/
